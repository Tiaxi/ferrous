<!-- Ferrous, 32 px. The 64-unit drawing, snapped to Breeze's 2 px margin: the 3 px glide and its 2 px harmonic, at twice its slope, start together. -->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect id="tile" fill="#3a1490" x="2" y="2" width="28" height="28" rx="2.5"/>
  <path id="harmonic" fill="none" stroke="#f0602a" stroke-width="2" stroke-linecap="round" d="M7 24 L20 8.8"/>
  <path id="glide" fill="none" stroke="#ffb000" stroke-width="3" stroke-linecap="round" d="M7 24 L25 13.5"/>
</svg>
