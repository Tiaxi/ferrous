  <path id="h2" fill="#f0602a" d="M24 13h2v1h-2z M22 14h4v1h-4z M20 15h4v1h-4z M18 16h4v1h-4z M16 17h4v1h-4z M14 18h4v1h-4z M12 19h4v1h-4z M10 20h4v1h-4z M8 21h4v1h-4z M6 22h4v1h-4z M6 23h2v1h-2z"/>
  <path id="fundamental" fill="#ffb000" d="M23 20h3v1h-3z M20 21h6v1h-6z M16 22h7v1h-7z M12 23h8v1h-8z M9 24h7v1h-7z M6 25h6v1h-6z M6 26h3v1h-3z"/>
</svg>
