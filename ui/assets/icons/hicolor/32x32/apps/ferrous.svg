  <rect id="tile" fill="#3a1490" x="3" y="3" width="26" height="26" rx="1.5"/>
  <path id="h3" fill="#e055b4" d="M6 15 10 11 11 11 13 9 14 9 15 8 17 8 18 7 19 7 20 6 22 6 23 5 26 5 27 4 29 4 29 6 28 6 27 7 24 7 23 8 21 8 20 9 19 9 18 10 16 10 15 11 14 11 12 13 11 13 6 18Z"/>
  <path id="h2" fill="#f25a7e" d="M6 20 7 19 8 19 10 17 11 17 12 16 14 16 15 15 17 15 18 14 21 14 22 13 26 13 27 12 29 12 29 14 28 14 27 15 23 15 22 16 19 16 18 17 16 17 15 18 13 18 12 19 11 19 9 21 8 21 7 22 6 21Z"/>
  <path id="fundamental" fill="#f2b035" d="M8 23 10 23 11 22 15 22 16 21 23 21 24 20 29 20 29 23 25 23 24 24 17 24 16 25 12 25 11 26 9 26 8 27 7 27 6 26 6 25Z"/>
