  <rect id="tile" fill="#3a1490" x="2" y="2" width="28" height="28" rx="2.5"/>
  <path id="h3" fill="none" stroke="#d20040" stroke-width="1.1" stroke-linecap="round" d="M7 17 L25 8"/>
  <path id="h2" fill="none" stroke="#f0602a" stroke-width="1.3" stroke-linecap="round" d="M7 20 L25 14"/>
  <path id="fundamental" fill="none" stroke="#ffb000" stroke-width="2" stroke-linecap="round" d="M7 23 L25 20"/>
</svg>
