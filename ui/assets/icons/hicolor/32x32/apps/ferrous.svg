<!-- Ferrous, 32 px, drawn on the pixel grid in Breeze's 2 px margin: the fundamental and its 2nd and 3rd harmonics, each 2 px tall in every column, start in one column a clear row apart, at one, two and three times the fundamental's height above the zero of frequency, and climb a row every four, two and one and a third columns. Each lower trace takes its first step after the one above it, so no two touch, even at a corner. Antialiased, the thinner harmonics broke into dots here (#373 hill climb, H6). -->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect id="tile" fill="#3a1490" x="2" y="2" width="28" height="28" rx="2.5"/>
