<?xml version="1.0" encoding="UTF-8"?>
<!-- Ferrous, 16 px, on the pixel grid in Breeze's 1 px margin, inside a 1 px mid-violet rim: two strokes, the glide in amber, 2 px tall over its first climb and 3 px from x 6 to the edge, with a row of the tile under it, so that it outweighs its 3rd harmonic in magenta, 2 px tall. From a common start at the lower left they rise 1 : 3 and fan apart, a clear row or more apart, each a closed shape with every vertex on a whole pixel: crisp flats and 45 degree climbs, square at the start. They run out flush to the tile's inner edge on the right, a crop of an endless spectrogram rather than a chart's series ending in the tile. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <rect id="rim" fill="#5a3fb0" x="1" y="1" width="14" height="14" rx="1.5"/>
  <rect id="tile" fill="#3a1490" x="2" y="2" width="12" height="12" rx="0.5"/>
  <path id="h3" fill="#e055b4" d="M3 8 6 5 7 5 8 4 9 4 10 3 14 3 14 5 11 5 10 6 9 6 8 7 6 7 3 10Z"/>
  <path id="fundamental" fill="#f2b035" d="M3 11 5 11 6 10 8 10 9 9 14 9 14 12 10 12 9 13 3 13Z"/>
</svg>
