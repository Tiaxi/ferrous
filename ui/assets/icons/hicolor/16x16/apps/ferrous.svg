<?xml version="1.0" encoding="UTF-8"?>
<!-- Ferrous, 16 px, drawn on the pixel grid in Breeze's 1 px margin: the fundamental and its 2nd harmonic, each 2 px tall in every column, start in one column with a clear row between them. The fundamental climbs one row every two columns and the harmonic one row every column, the two clean pixel diagonals, so the harmonic rises twice as fast and the two fan out from one point; shallower stairs broke into dashes that read as stripes (#373 hill climb, H6). -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <rect id="tile" fill="#3a1490" x="1" y="1" width="14" height="14" rx="1.5"/>
  <path id="h2" fill="#f0602a" d="M11 2h1v1h-1z M10 3h2v1h-2z M9 4h2v1h-2z M8 5h2v1h-2z M7 6h2v1h-2z M6 7h2v1h-2z M5 8h2v1h-2z M4 9h2v1h-2z M4 10h1v1h-1z"/>
  <path id="fundamental" fill="#ffb000" d="M10 9h2v1h-2z M8 10h4v1h-4z M6 11h4v1h-4z M4 12h4v1h-4z M4 13h2v1h-2z"/>
</svg>
