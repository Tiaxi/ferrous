<!-- Ferrous, 16 px. The glide rises from the floor band to about 70% of the width, 2 px wide; the harmonic leaves it at twice its slope as a 1 px stair of whole pixels. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <path id="tile" fill="#3a1490" d="M1 13 V2.5 A1.5 1.5 0 0 1 2.5 1 H13.5 A1.5 1.5 0 0 1 15 2.5 V13 Z"/>
  <path id="floor" fill="#a6006e" d="M1 13 H15 V13.5 A1.5 1.5 0 0 1 13.5 15 H2.5 A1.5 1.5 0 0 1 1 13.5 Z"/>
  <path id="harmonic" fill="#f0602a" d="M5 9h1v1h-1z M6 8h1v1h-1z M7 7h1v1h-1z M8 6h1v1h-1z M9 5h1v1h-1z"/>
  <path id="glide" fill="none" stroke="#ffb000" stroke-width="2" stroke-linecap="round" d="M4 12 L11 8.5"/>
</svg>
