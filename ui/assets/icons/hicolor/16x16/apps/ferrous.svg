<?xml version="1.0" encoding="UTF-8"?>
<!-- Ferrous, 16 px, drawn on the pixel grid in Breeze's 1 px margin, inside a 1 px rim lighter than the tile: the fundamental and its 3rd harmonic of a chirp on a log-frequency axis, 2/2 px stairs, the harmonics 4 rows above the fundamental. Each rises a row a column at first and bends over; they start and end in one column, with clear rows between them in every column and no corner contact (#373 hill climb, H8, H9, H10) -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <rect id="rim" fill="#6a4ad0" x="1" y="1" width="14" height="14" rx="1.5"/>
  <rect id="tile" fill="#3a1490" x="2" y="2" width="12" height="12" rx="0.5"/>
  <path id="h3" fill="#e055b4" d="M10 3h4v1h-4z M7 4h7v1h-7z M5 5h5v1h-5z M4 6h3v1h-3z M3 7h2v1h-2z M2 8h2v1h-2z M2 9h1v1h-1z"/>
  <path id="fundamental" fill="#f2b035" d="M10 7h4v1h-4z M7 8h7v1h-7z M5 9h5v1h-5z M4 10h3v1h-3z M3 11h2v1h-2z M2 12h2v1h-2z M2 13h1v1h-1z"/>
</svg>
