<!-- Ferrous, 16 px, drawn on the pixel grid. The glide, a 2 px stair at half the slope of a diagonal, rises off a 1 px floor line in the floor band's magenta; the harmonic, a 1 px diagonal at twice its slope, leaves it near the origin. Half-tones in the stair's inner corners, none in the fork between the strokes. Breeze's 1 px margin. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <rect id="tile" fill="#3a1490" x="1" y="1" width="14" height="14" rx="1.5"/>
  <path id="floor" fill="#a6006e" d="M2 12h12v1h-12z"/>
  <path id="harmonic" fill="#f0602a" d="M5 8h1v1h-1z M6 7h1v1h-1z M7 6h1v1h-1z M8 5h1v1h-1z M9 4h1v1h-1z M10 3h1v1h-1z"/>
  <path id="glide-edge" fill="#9c6248" d="M5 11h1v1h-1z M4 9h1v1h-1z M7 10h1v1h-1z M9 9h1v1h-1z M8 7h1v1h-1z M11 8h1v1h-1z M10 6h1v1h-1z"/>
  <path id="glide" fill="#ffb000" d="M3 10h2v2h-2z M5 9h2v2h-2z M7 8h2v2h-2z M9 7h2v2h-2z M11 6h2v2h-2z"/>
</svg>
