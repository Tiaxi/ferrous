  <rect id="rim" fill="#6a4ad0" x="1" y="1" width="14" height="14" rx="1.5"/>
  <rect id="tile" fill="#3a1490" x="2" y="2" width="12" height="12" rx="0.5"/>
  <path id="h3" fill="#e055b4" d="M10 2h4v1h-4z M8 3h2v1h-2z M6 4h2v1h-2z M5 5h1v1h-1z M4 6h1v1h-1z M3 7h1v1h-1z M2 8h1v1h-1z"/>
  <path id="fundamental" fill="#f2b035" d="M8 10h6v1h-6z M4 11h10v1h-10z M2 12h6v1h-6z M2 13h2v1h-2z"/>
</svg>
