<!-- Ferrous, 16 px, drawn on the pixel grid in Breeze's 1 px margin: the fundamental and its 2nd harmonic of a chirp on a log-frequency axis, one 2 px stair shifted up by 4 rows. Each rises a row a column at first and bends over to a row every three columns; they start and end in one column, with clear pixels between them everywhere, corners included (#373 hill climb, H8) -->
