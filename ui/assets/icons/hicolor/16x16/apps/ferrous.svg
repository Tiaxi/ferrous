<?xml version="1.0" encoding="UTF-8"?>
<!-- Ferrous, 16 px, drawn on the pixel grid in Breeze's 1 px margin. A 2 px floor; the fundamental a 2 px stair and its 2nd harmonic a 1 px stair, starting in one column at about one and two times its height above the floor and rising one and two times as far. No room for the 3rd harmonic with a clear row between. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <rect id="tile" fill="#3a1490" x="1" y="1" width="14" height="14" rx="1.5"/>
  <path id="floor" fill="#a6006e" d="M2 11h12v2h-12z"/>
  <path id="h2" fill="#f0602a" d="M3 6h2v1h-2z M5 5h2v1h-2z M7 4h2v1h-2z M9 3h2v1h-2z M11 2h2v1h-2z"/>
  <path id="fundamental" fill="#ffb000" d="M3 8h3v2h-3z M6 7h4v2h-4z M10 6h3v2h-3z"/>
</svg>
