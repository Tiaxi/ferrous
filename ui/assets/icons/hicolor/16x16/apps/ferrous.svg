<!-- Ferrous, 16 px, drawn on the pixel grid in Breeze's 1 px margin, inside a 1 px rim lighter than the tile: the glide and its 3rd harmonic, a 2 px stair under a 1 px line, 3 clear rows apart at their common start and 7 at the end, the harmonic rising three rows for each of the glide's, climbing a row a column at most (#373 hill climb, H8 to H13) -->
