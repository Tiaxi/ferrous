  <rect id="tile" fill="#3a1490" x="1" y="1" width="14" height="14" rx="1.5"/>
  <path id="h2" fill="#f25a7e" d="M11 2h3v1h-3z M9 3h5v1h-5z M7 4h4v1h-4z M5 5h4v1h-4z M4 6h3v1h-3z M3 7h2v1h-2z M2 8h2v1h-2z M2 9h1v1h-1z"/>
  <path id="fundamental" fill="#f2b035" d="M11 6h3v1h-3z M9 7h5v1h-5z M7 8h4v1h-4z M5 9h4v1h-4z M4 10h3v1h-3z M3 11h2v1h-2z M2 12h2v1h-2z M2 13h1v1h-1z"/>
</svg>
