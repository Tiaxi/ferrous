<!-- Ferrous, the 32 px slot at 2x (64 px), in Breeze's 4 px margin, inside a 2 px mid-violet rim, as the 16 and 22 px slots have at 2x: the 32 px drawing doubled, every coordinate and width twice the 1x one's, so that the slot has the same weight at either scale. A glide in amber and its 2nd and 3rd harmonics in rose and magenta rise 1 : 2 : 3 from a common start at the lower left and fan out, as smooth filled outlines of strokes 8/5/4.5 px wide, the glide eased to 6 px and the rose and the magenta to 4 px over their last 8 px into their ends' whole rows, with a round cap at the start only, running out flush to the tile's inner edge on the right: a crop of an endless spectrogram rather than a chart's series ending in the tile. -->
