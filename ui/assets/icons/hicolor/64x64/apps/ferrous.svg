  <rect id="tile" fill="#3a1490" x="6" y="6" width="52" height="52" rx="5"/>
  <path id="harmonic" fill="none" stroke="#f0602a" stroke-width="3" stroke-linecap="round" d="M15 47 L41 16.4"/>
  <path id="glide" fill="none" stroke="#ffb000" stroke-width="5" stroke-linecap="round" d="M15 47 L49 27"/>
</svg>
