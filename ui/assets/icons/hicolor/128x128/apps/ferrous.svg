<!-- Ferrous, 128 px, the 64-unit drawing in Breeze's 6 px margin, inside a mid-violet rim 1 device px wide: a glide and its 2nd and 3rd harmonics on a linear frequency axis. Each harmonic is the glide's frequency times its number, so from a common start at the lower left the three rise 1 : 2 : 3 and fan out across the tile, as filled outlines of strokes 4.5/2.72/2.21 units wide (the glide the heaviest, its added weight on its underside, the harmonics tapering from it), with a round cap at the start only. They run out flush to the tile's inner edge on the right, the top one clear of the tile's corner: a crop of an endless spectrogram rather than a chart's series ending in round caps inside the tile. A faint 4th harmonic in violet, 1.7 units wide, rises from the common start over them and leaves through the tile's top inner edge, cropped by it as the others are by the right one, clear of the corner where a task's badge sits. -->
