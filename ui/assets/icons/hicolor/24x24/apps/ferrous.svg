<!-- Ferrous, 24 px, on the pixel grid in a 3 px margin, inside a 1 px mid-violet rim: two strokes, the glide in amber, 3 px tall, and its 3rd harmonic in magenta, 2 px tall, from a common start at the lower left, a clear row or more apart, rising 1 : 3 and fanning apart, each a closed shape with every vertex on a whole pixel: crisp flats and 45 degree climbs, square at the start. The traces run out flush to the tile's inner edge on the right, a crop of an endless spectrogram rather than a chart's series ending in the tile (#373 hill climb, H8 to H19; H21: a lighter magenta start, the amber 3 px tall so that it outweighs the harmonic; H22: the 22 px drawing moved a pixel in, as Breeze draws a 24 px icon; it serves only the built-in window icon's 24 px pixmap (H24): in the icon theme, hicolor's 22 px directories serve the 24 px slot) -->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <rect id="rim" fill="#5a3fb0" x="3" y="3" width="18" height="18" rx="2"/>
  <rect id="tile" fill="#3a1490" x="4" y="4" width="16" height="16" rx="1"/>
  <path id="h3" fill="#e055b4" d="M5 13 11 7 12 7 13 6 15 6 16 5 20 5 20 7 17 7 16 8 14 8 13 9 12 9 11 10 10 10 5 15Z"/>
  <path id="fundamental" fill="#f2b035" d="M5 16 7 16 8 15 10 15 11 14 14 14 15 13 20 13 20 16 16 16 15 17 12 17 11 18 9 18 8 19 5 19Z"/>
</svg>
