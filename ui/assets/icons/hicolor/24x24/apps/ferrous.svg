<!-- Ferrous, 24 px: the 22 px drawing moved a pixel in, in a 3 px margin, as Breeze draws a 24 px icon, inside a 1 px mid-violet rim: two strokes, the glide in amber, 3 px tall, so that it outweighs its 3rd harmonic in magenta, 2 px tall, 3 rows over its first climb, as wide across its 45 degree slope as on its flats. From a common start at the lower left they rise 1 : 3 and fan apart, a clear row or more apart, each a closed shape with every vertex on a whole pixel: crisp flats and 45 degree climbs, square at the start. They run out flush to the tile's inner edge on the right, a crop of an endless spectrogram rather than a chart's series ending in the tile. The magenta is a step lighter than the larger drawings', as its antialiased climbs cover less of each pixel, so that it shows as bright on the tile as theirs. It serves only the built-in window icon's 24 px pixmap: in the icon theme, hicolor's 22 px directories serve the 24 px slot. -->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <rect id="rim" fill="#5a3fb0" x="3" y="3" width="18" height="18" rx="2"/>
  <rect id="tile" fill="#3a1490" x="4" y="4" width="16" height="16" rx="1"/>
  <path id="h3" fill="#ea6cc2" d="M5 12 10 7 12 7 13 6 15 6 16 5 20 5 20 7 17 7 16 8 14 8 13 9 12 9 11 10 10 10 5 15Z"/>
  <path id="fundamental" fill="#f2b035" d="M5 16 7 16 8 15 10 15 11 14 14 14 15 13 20 13 20 16 16 16 15 17 12 17 11 18 9 18 8 19 5 19Z"/>
</svg>
