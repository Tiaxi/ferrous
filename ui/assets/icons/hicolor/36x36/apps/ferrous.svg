<!-- Ferrous, 36 px, in a 3 px margin, inside a 1 px mid-violet rim: the 64-unit drawing's composition on the 36 px grid. A glide in amber and its 2nd and 3rd harmonics in rose and magenta rise 1 : 2 : 3 from a common start at the lower left and fan out, their exits some 1.75 times as far apart as their starts, as antialiased filled outlines of strokes 4/2.5/2.25 px wide; the glide the heaviest, its added weight on its underside, the rose and the magenta eased to 2 px over their last 4 px into their ends' two rows, with a round cap at the start only. They run out flush to the tile's inner edge on the right, their ends on whole rows, the top trace's 3 px under the tile's top inner edge: a crop of an endless spectrogram rather than a chart's series ending in the tile. A drawing of its own for the 36 px slot, in a 30 px rim. -->
