  <rect id="tile" fill="#3a1490" x="2" y="2" width="18" height="18" rx="2"/>
  <path id="h2" fill="#f0602a" d="M15 4h1v1h-1z M14 5h2v1h-2z M13 6h2v1h-2z M12 7h2v1h-2z M11 8h2v1h-2z M10 9h2v1h-2z M9 10h2v1h-2z M8 11h2v1h-2z M7 12h2v1h-2z M6 13h2v1h-2z M6 14h1v1h-1z"/>
  <path id="fundamental" fill="#ffb000" d="M14 12h2v1h-2z M12 13h4v1h-4z M10 14h4v1h-4z M8 15h4v1h-4z M6 16h4v1h-4z M6 17h2v1h-2z"/>
</svg>
