  <path id="harmonic" fill="#f0602a" d="M5 15h1v1h-1z M6 14h1v1h-1z M7 13h1v1h-1z M8 12h1v1h-1z M9 11h1v1h-1z M10 10h1v1h-1z M11 9h1v1h-1z M12 8h1v1h-1z"/>
