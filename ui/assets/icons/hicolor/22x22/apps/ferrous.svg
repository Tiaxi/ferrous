<!-- Ferrous, 22 px, drawn on the pixel grid in Breeze's 2 px margin: the 16 px drawing over ten columns. The fundamental and its 2nd harmonic, each 2 px tall in every column, start in one column with a clear row between them; the fundamental climbs one row every two columns and the harmonic one row every column, so they fan out from one point (#373 hill climb, H6). -->
