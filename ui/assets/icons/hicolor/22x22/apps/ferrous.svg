<!-- Ferrous, 22 px, on the pixel grid in Breeze's 2 px margin, inside a 1 px mid-violet rim: two strokes, the glide in amber and its 3rd harmonic in magenta, each 2 px tall, from a common start at the lower left, two clear rows apart at the start, rising 1 : 3 and fanning apart, each a closed shape with every vertex on a whole pixel: crisp flats and 45 degree climbs, square at the start. The traces run out flush to the tile's inner edge on the right, a crop of an endless spectrogram rather than a chart's series ending in the tile (#373 hill climb, H8 to H18; H19: one drawing from 16 to 48 px, the traces run out to the edge) -->
