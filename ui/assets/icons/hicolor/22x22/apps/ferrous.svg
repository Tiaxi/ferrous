<?xml version="1.0" encoding="UTF-8"?>
<!-- Ferrous, 22 px, on the pixel grid in Breeze's 2 px margin, inside a 1 px mid-violet rim: two strokes, the glide in amber and its 3rd harmonic in magenta, each 2 px tall, from a common start at the lower left 2 clear rows apart, the harmonic rising three rows for each of the glide's, a row a column at most; every vertex on a whole pixel, so the flats are crisp and only the climbs are antialiased (#373 hill climb, H8 to H13; H18: two clean strokes, not dotted stairs, and no middle trace) -->
<svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
  <rect id="rim" fill="#5a3fb0" x="2" y="2" width="18" height="18" rx="2"/>
  <rect id="tile" fill="#3a1490" x="3" y="3" width="16" height="16" rx="1"/>
  <path id="h3" fill="#e055b4" d="M4 12 9 7 10 7 11 6 12 6 13 5 15 5 16 4 18 4 18 6 16 6 15 7 13 7 12 8 11 8 10 9 9 9 4 14Z"/>
  <path id="fundamental" fill="#f2b035" d="M4 16 5 16 6 15 8 15 9 14 12 14 13 13 18 13 18 15 13 15 12 16 9 16 8 17 6 17 5 18 4 18Z"/>
</svg>
