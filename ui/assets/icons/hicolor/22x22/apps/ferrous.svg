  <path id="h3" fill="#e055b4" d="M4 11 8 7 9 7 10 6 11 6 12 5 14 5 15 4 19 4 19 6 16 6 15 7 13 7 12 8 11 8 10 9 9 9 4 14Z"/>
  <path id="fundamental" fill="#f2b035" d="M4 16 6 16 7 15 9 15 10 14 13 14 14 13 19 13 19 15 15 15 14 16 11 16 10 17 8 17 7 18 4 18Z"/>
