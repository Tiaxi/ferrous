<!-- Ferrous, 48 px, on the pixel grid in Breeze's 4 px margin, inside a 1 px mid-violet rim: the glide in amber, 3 px tall, and its 2nd and 3rd harmonics in rose and magenta, 2 px tall, from a common start at the lower left, a clear row or more apart, rising 1 : 2 : 3 and fanning apart, each a closed shape with every vertex on a whole pixel: crisp flats and 45 degree climbs, one edge a column behind the other where it climbs, so that a stroke is about as wide across at any slope as on a flat, the start's corners cut by a pixel's diagonal, a round cap on the grid. The traces run out flush to the tile's inner edge on the right, a crop of an endless spectrogram rather than a chart's series ending in the tile (#373 hill climb, H8 to H18; H19: one drawing from 16 to 48 px, the traces run out to the edge) -->
