  <rect id="tile" fill="#3a1490" x="4" y="4" width="40" height="40" rx="4"/>
  <path id="harmonic" fill="none" stroke="#f0602a" stroke-width="2.5" stroke-linecap="round" d="M11 36 L31 12.9"/>
  <path id="glide" fill="none" stroke="#ffb000" stroke-width="4" stroke-linecap="round" d="M11 36 L37 21"/>
</svg>
