<!-- Ferrous's mark for 20 px and under (ferrous-mark-symbolic.svg is for 24 px and up), the
     now-playing panel's "Nothing playing" glyph at the default font: the glide under its 3rd
     harmonic alone, as the library's 20 px no-art tile draws them (three 1.5 px strokes 1.5 px
     apart read as a slanted hatch at 16 px). Each starts on its own in one column at the left,
     4.5 px apart, 2.75 px clear, and they rise 1 : 3, 2 and 6 px, most of it in their first
     half, bending over as a glide does, so they fan apart to 8.5 px at the right, where they run
     out to the square's edge. Round caps, 1.75 px strokes. A one-colour mask, drawn in the
     secondary text colour. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
<path fill="none" stroke="#000" stroke-width="1.75" stroke-linecap="round" d="M2.75 13.25C6.75 12.15 11.25 11.45 15.25 11.25"/>
<path fill="none" stroke="#000" stroke-width="1.75" stroke-linecap="round" d="M2.75 8.75C6.75 5.45 11.25 3.35 15.25 2.75"/>
</svg>
