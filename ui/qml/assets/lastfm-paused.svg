<!-- The status bar's Last.fm glyph while scrobbling is paused: lastfm.svg struck through, with a gap
     around the stroke. A one-colour mask, drawn in the text colours. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
<defs>
<mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
<rect width="16" height="16" fill="#fff"/>
<path d="M1.5 1.5 14.5 14.5" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
</mask>
</defs>
<g mask="url(#gap)">
<rect x="2" y="4" width="5" height="8" rx="2" fill="none" stroke="#000" stroke-width="2"/>
<path d="M7 4V13" stroke="#000" stroke-width="2"/>
<path d="M15 4H12Q10 4 10 6Q10 8 12 8Q14 8 14 10Q14 12 12 12H9" fill="none" stroke="#000" stroke-width="2"/>
</g>
<path d="M1.5 1.5 14.5 14.5" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
</svg>
