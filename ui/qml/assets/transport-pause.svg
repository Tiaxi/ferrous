<!-- The transport's Pause glyph, drawn for 20 px at 1x on whole pixels: Breeze's two bars,
     5 px wide with 4 px between them, 14 px tall in rows 3 to 16; the Play glyph it cross-fades
     with reaches a pixel past them at each end with its tips, as a point needs to look as tall.
     A one-colour mask, drawn in the text colour. -->
<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path fill="#000" d="M3 3h5v14h-5z M12 3h5v14h-5z"/>
</svg>
