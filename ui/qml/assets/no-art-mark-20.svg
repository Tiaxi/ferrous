  <path id="h3" fill="#e055b4" d="M3 11h1v1h-1z M4 10h1v1h-1z M5 9h1v1h-1z M6 8h2v1h-2z M8 7h2v1h-2z M10 6h3v1h-3z M13 5h4v1h-4z"/>
  <path id="fundamental" fill="#f2b035" d="M3 14h3v2h-3z M6 13h5v2h-5z M11 12h6v2h-6z"/>
</svg>
