<!-- The library's mark for an album without a cover, on its 20 px tile, drawn on the pixel grid inside the tile's 1 px edge: the glide, a 2 px stair, under its 3rd harmonic, a 1 px line, 2 clear rows apart at their common start and 6 at the end, the harmonic rising three rows for each of the glide's (no-art-mark.svg, as the icon's 16 px size draws it; #373 hill climb, H14 F2) -->
