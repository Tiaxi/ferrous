<!-- The visualization mode switch's Spectrogram glyph (#373 H14 G7), drawn for 16 px at 1x: the app
     icon's three traces, a glide and its harmonics, from a common start at the lower left. The lowest
     is the icon's fundamental, a 1.5 px stroke from x 2 to 14 that rises 1 px along its length and
     bends over as a glide does (#373 H20: level at y 14.5 it read as a chart's baseline; H16 I7:
     without it the other two read as "//"). The harmonic, the icon's top trace, starts with it and
     leaves it at some 62 degrees, bending over to 29 (#373 H19: it rose at 81 degrees, a hook beside
     the icon's curve); the middle trace leaves it a third of the way along. The upper two are some
     1.7 px clear of each other everywhere, and end 1.6 px or more clear of the lowest. 1.75 px strokes
     with round caps, a weight beside Breeze's waveform glyph (#373 H15 H8). A one-colour mask, drawn in
     the plot's text colour. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
<path fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" d="M2.75 14.75C5.5 14.25 9.25 13.75 13.25 13.75"/>
<path fill="none" stroke="#000" stroke-width="1.75" stroke-linecap="round" d="M2.75 14.75C5 10.5 8.25 7.5 13.25 4.75"/>
<path fill="none" stroke="#000" stroke-width="1.75" stroke-linecap="round" d="M7.25 14.1C9 12.1 11 11 13.25 10.5"/>
</svg>
