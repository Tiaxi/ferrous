     the text colour, which sets it apart from the letters. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
<path fill="#000" d="M15 14 2 1 1 2 14 15Z"/>
</svg>
