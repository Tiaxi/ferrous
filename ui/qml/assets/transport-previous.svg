<!-- The transport's Previous glyph (#373 H9), drawn for 16 px at 1x on whole pixels in Breeze's 16
     px geometry: two triangles pointing left and a 2 px bar at the left edge, 12 px tall in rows 2
     to 13, as Previous, Stop, Next and the volume all are. Ferrous's own, so that the transport
     keeps one scale at every font size: a theme draws its larger sizes from other designs, with more
     space around the glyph. A one-colour mask, drawn in the text colour. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
<path fill="#000" d="M16 2v12l-7-6z M9 2v12l-7-6z M0 2h2v12h-2z"/>
</svg>
