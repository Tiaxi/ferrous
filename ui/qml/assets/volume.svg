<!-- The transport's volume glyph, outlines drawn for 16 px at the weight of the transport's glyphs
     beside it (Breeze's speaker, with 1 px waves, read lighter than Next): a solid speaker in columns 1
     to 7 and rows 2 to 13, as tall as Next, and two waves as 2 px arcs, whole pixels where they are
     upright, with clear space between each part. Its diagonals and arcs are smooth at 2x and at a
     larger font (a grid of squares was a staircase there). A one-colour mask, drawn in the text
     colour. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
<path fill="#000" d="M1 5H3.5L6.5 2H8V14H6.5L3.5 11H1Z"/>
<path fill="none" stroke="#000" stroke-width="2" stroke-linecap="butt" d="M9.8 5.1C10.6 5.7 11 6.3 11 7V9C11 9.7 10.6 10.3 9.8 10.9 M12 2.6C13.9 3.8 15 5.4 15 7V9C15 10.6 13.9 12.2 12 13.4"/>
</svg>
