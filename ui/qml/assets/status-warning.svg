<!-- The status bar's warning glyph, drawn for 16 px, its base's lower edge on a whole pixel: a
     one-colour mask, drawn in the negative or secondary colour. At the optical size of its
     neighbours, the 12 px of dialog-error's square and of the info glyph's circle: 12 px across and
     10.6 px high, 86 % of what it drew when it filled the box (it was the largest glyph in a row). -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
<path d="M8 3.05l5.35 9.3H2.65z" fill="none" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M8 6.3v2.5M8 10.5v.1" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
</svg>
