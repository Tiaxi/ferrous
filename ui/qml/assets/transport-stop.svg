<!-- The transport's Stop glyph, drawn for 16 px at 1x on whole pixels in Breeze's 16 px
     geometry: a 10 px square in rows 3 to 12, centred in the box, so that its ink stays under
     Play's and Pause's beside it (a 12 px square matched Pause and outweighed Play). Ferrous's
     own, so that the transport keeps one scale at every font size: a theme draws its larger sizes
     from other designs, with more space around the glyph. A one-colour mask, drawn in the text
     colour. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
<path fill="#000" d="M3 3h10v10h-10z"/>
</svg>
