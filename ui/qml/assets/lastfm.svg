<!-- The status bar's Last.fm glyph (#373 H6), drawn for 16 px at 1x: a bold "as", 2 px strokes on whole
     pixels, 10 px tall (y 3 to 13), the a 7 px wide with a 3 px counter, 1 px apart from the s, whose three
     bars have 2 px between them. A one-colour mask, drawn in the text colours. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
<rect x="2" y="4" width="5" height="8" rx="2" fill="none" stroke="#000" stroke-width="2"/>
<path d="M7 4V13" stroke="#000" stroke-width="2"/>
<path d="M15 4H12Q10 4 10 6Q10 8 12 8Q14 8 14 10Q14 12 12 12H9" fill="none" stroke="#000" stroke-width="2"/>
</svg>
