name: CI

on:
  push:
    branches: [main, master]
    tags-ignore:
      - '**'
  pull_request:

jobs:
  rust-backend:
    name: Rust Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux deps for gst feature
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-features -- -D clippy::pedantic

      - name: Test (GStreamer backend)
        run: cargo test --features gst

      - name: Test (profiling instrumentation)
        run: cargo test --features "gst profiling-logs"

      - name: Test (mock backend)
        run: cargo test

  ui:
    name: "UI Build + Smoke Tests${{ matrix.profile_logs == 'ON' && ' (profiling)' || '' }}"
    strategy:
      matrix:
        profile_logs: ['OFF', 'ON']
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install system dependencies
        run: |
          dnf -y install \
            git \
            cmake \
            ninja-build \
            gcc-c++ \
            zsh \
            rust \
            cargo \
            pkgconf-pkg-config \
            glib2-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtquickcontrols2-devel \
            kf6-kirigami-devel \
            xorg-x11-server-Xvfb \
            mesa-dri-drivers

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure UI
        run: cmake -S ui -B ui/build -G Ninja -DFERROUS_ENABLE_PROFILE_LOGS=${{ matrix.profile_logs }}

      - name: Build UI
        run: cmake --build ui/build -j2

      - name: Run UI smoke tests
        run: ctest --test-dir ui/build --output-on-failure -V

      - name: Compare native waveform rendering and texture reuse
        run: |
          Xvfb :99 -screen 0 3440x1440x24 -nolisten tcp &
          trap 'kill $!' EXIT
          for attempt in 1 2 3 4 5; do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 1
          done
          export DISPLAY=:99 QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=rhi
          export QSG_RHI_BACKEND=opengl QSG_RENDER_LOOP=basic LIBGL_ALWAYS_SOFTWARE=1
          ./ui/build/ferrous_qml_smoke_tests waveformSceneGraphMatchesRaster waveformSceneGraphReusesTextures
          QT_SCALE_FACTOR=2 ./ui/build/ferrous_qml_smoke_tests waveformSceneGraphMatchesRaster
          QSG_RENDER_LOOP=threaded ./ui/build/ferrous_qml_smoke_tests waveformSceneGraphMatchesRaster
