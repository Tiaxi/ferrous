name: CI

on:
  push:
    branches: [main, master]
    # The release workflow runs these checks on the tagged commit itself.
    tags-ignore:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-backend:
    name: "Rust Backend Checks${{ matrix.toolchain == 'fedora' && ' (Fedora Rust)' || '' }}${{ matrix.fedora != '44' && format(' (Fedora {0}, non-blocking)', matrix.fedora) || '' }}"
    strategy:
      fail-fast: false
      matrix:
        # pinned: the reviewed toolchain, which also runs formatting, Clippy
        # and cargo audit on the release platform.
        # fedora: Fedora's rust and cargo packages, which build the release RPMs.
        # The next Fedora release tests the pinned toolchain against its
        # system libraries, without blocking merges.
        include:
          - fedora: '44'
            toolchain: pinned
            lint: true
            timeout: 30
          - fedora: '44'
            toolchain: fedora
            timeout: 30
          - fedora: '45'
            toolchain: pinned
            experimental: true
            timeout: 40
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: ${{ matrix.timeout }}
    container:
      image: fedora:${{ matrix.fedora }}
    env:
      # Give up on a stalled mirror instead of waiting on it.
      DNF_OPTS: --setopt=retries=3 --setopt=timeout=30 --setopt=minrate=10240
      FEDORA: ${{ matrix.fedora }}
    steps:
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          # RPM Fusion's full FFmpeg, as on the release platform, so the libav
          # plugin has the AC-3, DTS, AAC and MP3 codecs the fixture tests use.
          # The release RPM comes from a mirror, so check its signature
          # against RPM Fusion's key from Fedora's signed distribution-gpg-keys.
          # Retry refused connections and other errors too: the mirror
          # redirector sometimes refuses them.
          dnf -y $DNF_OPTS install distribution-gpg-keys
          rpm --import "/usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-$FEDORA"
          release_rpm="$RUNNER_TEMP/rpmfusion-free-release-$FEDORA.noarch.rpm"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 120 \
            --output "$release_rpm" \
            "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$FEDORA.noarch.rpm"
          rpm --checksig "$release_rpm"
          dnf -y $DNF_OPTS --setopt=localpkg_gpgcheck=1 install "$release_rpm"
          # util-linux has setpriv and shadow-utils has useradd, which the
          # test user steps need; newer images no longer bring util-linux.
          dnf -y $DNF_OPTS install --allowerasing \
            git \
            curl \
            tar \
            zstd \
            util-linux \
            shadow-utils \
            gcc \
            pkgconf-pkg-config \
            dbus-devel \
            glib2-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            gstreamer1-plugins-good \
            gstreamer1-plugin-libav \
            ffmpeg-libs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        if: matrix.toolchain == 'pinned'
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Install Fedora's Rust toolchain
        if: matrix.toolchain == 'fedora'
        timeout-minutes: 10
        run: dnf -y $DNF_OPTS install rust cargo

      - name: Show Rust toolchain
        run: |
          command -v rustc cargo
          rustc --version
          cargo --version
          if [ "${{ matrix.toolchain }}" = fedora ]; then
            # The tools on the path must be the packaged ones, not a rustup
            # toolchain; rpm fails for files that no package owns.
            rpm -qf "$(realpath "$(command -v rustc)")" "$(realpath "$(command -v cargo)")"
          fi

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust-fedora-${{ matrix.fedora }}${{ matrix.toolchain == 'fedora' && '-fedora-rust' || '' }}"

      # Lints stay on the pinned toolchain, so that new lints in a Fedora Rust
      # update do not fail CI. Test code is linted too; src/lib.rs exempts it
      # from the pedantic group only.
      - name: Check formatting
        if: matrix.lint
        run: cargo fmt --check

      - name: Clippy
        if: matrix.lint
        run: cargo clippy --locked --all-features --all-targets -- -D warnings -D clippy::pedantic

      # The mock backend builds code that the GStreamer features leave out.
      # gst is a default feature, so it builds without the defaults.
      - name: Clippy (mock backend)
        if: matrix.lint
        run: cargo clippy --locked --no-default-features --features cli --all-targets -- -D warnings -D clippy::pedantic

      - name: Install cargo-audit
        if: matrix.lint
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Reads the ignore list in .cargo/audit.toml, as scripts/run-tests.sh does.
      - name: Audit dependencies
        if: matrix.lint
        run: cargo audit

      - name: Isolate test user directories
        run: |
          mkdir -p "$RUNNER_TEMP/xdg/config" "$RUNNER_TEMP/xdg/data" "$RUNNER_TEMP/xdg/cache"
          {
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg/config"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg/data"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg/cache"
          } >> "$GITHUB_ENV"

      - name: Create an unprivileged test user
        run: |
          # Root reads locked folders and may give files away, so the tests
          # of those refusals skip under it. Test as a user in a supplementary
          # group instead, as on a desktop.
          groupadd ferrous-test
          useradd --create-home --groups ferrous-test tester
          chown -R tester: "$GITHUB_WORKSPACE" "$HOME" "$RUNNER_TEMP/xdg"

      - name: Test (GStreamer backend)
        shell: setpriv --reuid=tester --regid=tester --init-groups bash -e {0}
        run: cargo test --locked --features gst

      - name: Test (profiling instrumentation)
        if: matrix.toolchain == 'pinned'
        shell: setpriv --reuid=tester --regid=tester --init-groups bash -e {0}
        run: cargo test --locked --features "gst profiling-logs"

      - name: Test (mock backend)
        if: matrix.toolchain == 'pinned'
        shell: setpriv --reuid=tester --regid=tester --init-groups bash -e {0}
        run: cargo test --locked --no-default-features --features cli

  ui:
    name: "UI Build + Smoke Tests${{ matrix.profile_logs == 'ON' && ' (profiling, Debug)' || '' }}"
    strategy:
      matrix:
        # The profiling build is a Debug build too, which enables Q_ASSERT in
        # the app and in Qt's headers, such as Qt's check that a slot does not
        # run on a half-destroyed object.
        include:
          - profile_logs: 'OFF'
            build_type: RelWithDebInfo
          - profile_logs: 'ON'
            build_type: Debug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: fedora:44
    env:
      # Give up on a stalled mirror instead of waiting on it.
      DNF_OPTS: --setopt=retries=3 --setopt=timeout=30 --setopt=minrate=10240
    steps:
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          dnf -y $DNF_OPTS install \
            git \
            cmake \
            ninja-build \
            gcc-c++ \
            rust \
            cargo \
            pkgconf-pkg-config \
            dbus-devel \
            glib2-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtquickcontrols2-devel \
            kf6-kirigami-devel \
            kf6-ki18n-devel \
            gettext \
            glibc-langpack-en \
            xorg-x11-server-Xvfb \
            mesa-dri-drivers

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The UI jobs build the Rust library with Fedora's Rust, as the release
      # RPMs do; the Rust job covers the pinned toolchain. CMake builds it in
      # the build directory's own Cargo target directory.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-ui-fedora-44-fedora-rust
          key: profile-logs-${{ matrix.profile_logs }}
          workspaces: ". -> ui/build/cargo"

      - name: Configure UI
        run: >-
          cmake -S ui -B ui/build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DFERROUS_ENABLE_PROFILE_LOGS=${{ matrix.profile_logs }}

      - name: Build UI
        run: cmake --build ui/build -j2

      - name: Isolate test user directories
        run: |
          mkdir -p "$RUNNER_TEMP/xdg/config" "$RUNNER_TEMP/xdg/data" "$RUNNER_TEMP/xdg/cache"
          {
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg/config"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg/data"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg/cache"
          } >> "$GITHUB_ENV"

      - name: Run UI smoke tests
        run: ctest --test-dir ui/build --output-on-failure -V

      - name: Compare native waveform rendering and texture reuse
        run: |
          Xvfb :99 -screen 0 3440x1440x24 -nolisten tcp &
          trap 'kill $!' EXIT
          for attempt in 1 2 3 4 5; do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 1
          done
          export DISPLAY=:99 QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=rhi
          export QSG_RHI_BACKEND=opengl QSG_RENDER_LOOP=basic LIBGL_ALWAYS_SOFTWARE=1
          ./ui/build/ferrous_qml_smoke_tests waveformSceneGraphMatchesRaster waveformSceneGraphReusesTextures
          QT_SCALE_FACTOR=2 ./ui/build/ferrous_qml_smoke_tests waveformSceneGraphMatchesRaster
          QSG_RENDER_LOOP=threaded ./ui/build/ferrous_qml_smoke_tests waveformSceneGraphMatchesRaster
