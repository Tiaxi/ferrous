name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-rpm:
    name: Build RPM (Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [44]
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - name: Install packaging tools
        run: dnf -y install git rpm-build appstream desktop-file-utils

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Mark repo safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # rpmbuild checks the spec's BuildRequires, including Fedora's Rust
      # toolchain, which builds the package.
      - name: Install build dependencies
        run: dnf -y builddep packaging/rpm/ferrous.spec

      - name: Build RPM
        env:
          FERROUS_LASTFM_API_KEY: ${{ secrets.FERROUS_LASTFM_API_KEY }}
          FERROUS_LASTFM_SHARED_SECRET: ${{ secrets.FERROUS_LASTFM_SHARED_SECRET }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/build-rpm.sh \
            --release "1%{?dist}" \
            --no-check

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v5
        with:
          name: rpm-package-fc${{ matrix.fedora }}
          path: |
            dist/rpm/RPMS/**/*.rpm
            !dist/rpm/RPMS/**/*-debuginfo-*.rpm
            !dist/rpm/RPMS/**/*-debugsource-*.rpm

  create-release:
    name: Create GitHub Release
    needs: [build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: packages

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/rpm-package-fc*/**/*.rpm
