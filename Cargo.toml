[package]
name = "ferrous"
version = "0.2.2"
edition = "2021"
description = "A fast, Linux-native desktop music player"
license = "GPL-3.0-or-later"
repository = "https://github.com/Tiaxi/ferrous"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
data-encoding = "2"
libc = "0.2"
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-audio = { version = "0.25", optional = true }
gstreamer-base = { version = "0.25", optional = true }
gstreamer-pbutils = { version = "0.25", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Linux only, against the system libdbus.
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent"] }
lofty = "0.24"
md5 = "0.7"
parking_lot = "0.12"
realfft = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
strsim = "0.11"
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
unicode-normalization = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"], optional = true }
url = "2"
walkdir = "2"

[[bin]]
name = "frontend_cli"
required-features = ["cli"]

[features]
# The desktop app's CMake build selects its features itself, without these
# defaults. Build without default features for the mock playback backend.
default = ["gst", "cli"]
# The command-line frontend in src/bin/frontend_cli.rs.
cli = ["dep:tracing-subscriber"]
gst = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-audio", "dep:gstreamer-base", "dep:gstreamer-pbutils"]
profiling-logs = []

# Line tables give backtraces, coredumps and debuginfo packages Rust file and
# line numbers.
[profile.release]
debug = "line-tables-only"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
